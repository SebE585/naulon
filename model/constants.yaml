# Naulon — model constants
#
# This file is the source of truth. Every implementation (Python, JavaScript)
# reads it; none of these numbers may be hard-coded in code.
#
# Every constant carries a `status`:
#   derived   — computable from first principles or a public standard; no
#               measurement needed. The `basis` field says from what.
#   to_source — placeholder awaiting a citation to a publicly documented
#               protocol specification. DO NOT publish results that lean on
#               these without sourcing them first.
#   to_measure— awaiting empirical measurement. The `method` field says how.
#
# A constant with status `to_source` or `to_measure` and no source is NOT a
# fact. It is a placeholder. The CLI flags them in every report.

version: 0.1.0

transport:
  ip_tcp_header_bytes:
    value: 40
    status: derived
    basis: "IPv4 header 20 B (RFC 791) + TCP header 20 B (RFC 793), no options"
  ack_bytes:
    value: 40
    status: derived
    basis: "bare TCP ACK segment, IPv4 + TCP headers, no payload"
  count_downlink:
    value: true
    status: to_source
    note: "Most M2M plans bill both directions. Contract-specific; expose as a user toggle."
  mss_bytes:
    value: 1400
    status: derived
    basis: "conservative MSS for cellular paths with tunnelling overhead"
  tcp_handshake_bytes:
    value: 120
    status: derived
    basis: "SYN + SYN-ACK + ACK, 40 B each, no options"
  tls_handshake_full_bytes:
    value: null
    status: to_measure
    method: "capture a full TLS 1.3 handshake at the receiving socket; dominated by certificate chain size"
  tls_handshake_resumed_bytes:
    value: null
    status: to_measure
    method: "capture a resumed TLS 1.3 handshake (PSK) at the receiving socket"
  tls_record_overhead_bytes:
    value: 22
    status: derived
    basis: "TLS 1.3 record: 5 B header + 16 B AEAD tag + 1 B content type"

framing:
  record_framing_bytes:
    value: 50
    status: to_source
    note: >
      Per-record envelope excluding the semantic fields listed below: length
      prefixes, element counts, type tags, checksums. Observed range across
      binary telematics protocols is roughly 40-60 B. MUST be replaced by a
      sourced range across at least three publicly documented specifications
      before any published result depends on it.
  batch_framing_bytes:
    value: 16
    status: to_source
    note: "Per-transmission wrapper around a batch of records: preamble, count, CRC."

billing:
  session_floor_bytes:
    value: 1024
    status: to_measure
    method: >
      Compare per-session byte counts reported by the operator against bytes
      counted at the receiving socket for the same sessions. The floor is the
      value below which billed volume stops tracking actual volume.
    note: "Contract-specific. Exposed as a user input; this is only a default."

# ---------------------------------------------------------------------------
# Fields
#
# clock:
#   record  — emitted once per output record
#   fix     — follows GNSS acquisition; billed at output rate unless the device
#             deduplicates repeated fixes
#   sample  — follows the inertial sampling rate
#   state   — changes rarely; event-driven unless the device repeats it
#
# encoding: raw | delta | varint
# ---------------------------------------------------------------------------

fields:

  # -- identity and record header ------------------------------------------
  - id: device_id
    family: identity
    clock: record
    bytes: 8
    encoding: raw
    default: false
    note: >
      Belongs to the session, not to the record. Naive stacks repeat it in
      every record. Enabling this is usually a pure loss.
  - id: timestamp_absolute
    family: identity
    clock: record
    bytes: 8
    encoding: raw
    default: true
    status: derived
    basis: "milliseconds since epoch, 64-bit"
  - id: timestamp_delta
    family: identity
    clock: record
    bytes: 2
    encoding: delta
    default: false
    note: "Alternative to timestamp_absolute; 16 bits covers ~65 s of offset."
  - id: sequence_counter
    family: identity
    clock: record
    bytes: 2
    encoding: raw
    default: false
  - id: event_priority
    family: identity
    clock: record
    bytes: 1
    encoding: raw
    default: false

  # -- position -------------------------------------------------------------
  - id: latitude
    family: position
    clock: fix
    bytes: 4
    encoding: raw
    default: true
    status: derived
    basis: "signed 32-bit at 1e-7 degree resolution (~1.1 cm)"
  - id: longitude
    family: position
    clock: fix
    bytes: 4
    encoding: raw
    default: true
    status: derived
    basis: "signed 32-bit at 1e-7 degree resolution"
  - id: altitude
    family: position
    clock: fix
    bytes: 2
    encoding: raw
    default: true
    status: derived
    basis: "signed 16-bit metres"
  - id: speed
    family: position
    clock: fix
    bytes: 2
    encoding: raw
    default: true
  - id: heading
    family: position
    clock: fix
    bytes: 2
    encoding: raw
    default: true
    status: derived
    basis: "unsigned 16-bit at 0.01 degree resolution"

  # -- GNSS quality ---------------------------------------------------------
  # Cheap per byte, and the first thing everyone cuts. Naulon exists partly to
  # show what that saves (little) and what it costs (the ability to know
  # whether your own data is any good).
  - id: satellites
    family: gnss_quality
    clock: fix
    bytes: 1
    encoding: raw
    default: true
  - id: hdop
    family: gnss_quality
    clock: fix
    bytes: 2
    encoding: raw
    default: false
  - id: vdop
    family: gnss_quality
    clock: fix
    bytes: 2
    encoding: raw
    default: false
  - id: pdop
    family: gnss_quality
    clock: fix
    bytes: 2
    encoding: raw
    default: false
  - id: fix_type
    family: gnss_quality
    clock: fix
    bytes: 1
    encoding: raw
    default: false
    note: "none / 2D / 3D / differential / float / fixed"
  - id: position_uncertainty
    family: gnss_quality
    clock: fix
    bytes: 2
    encoding: raw
    default: false
    note: "estimated horizontal error, centimetres"

  # -- inertial -------------------------------------------------------------
  # The only family on the sample clock. At 10 Hz it dominates everything else
  # by an order of magnitude — which is exactly why it is blamed for bills it
  # did not cause.
  - id: accel_xyz
    family: inertial
    clock: sample
    bytes: 6
    encoding: raw
    default: true
    status: derived
    basis: "3 axes x signed 16-bit; 16 bits is sufficient for vehicle dynamics"
  - id: gyro_xyz
    family: inertial
    clock: sample
    bytes: 6
    encoding: raw
    default: false
    status: derived
    basis: "3 axes x signed 16-bit"
  - id: magneto_xyz
    family: inertial
    clock: sample
    bytes: 6
    encoding: raw
    default: false
    status: derived
    basis: "3 axes x signed 16-bit"

  # -- vehicle state --------------------------------------------------------
  - id: ignition
    family: vehicle_state
    clock: state
    bytes: 1
    encoding: raw
    default: true
    note: >
      Nearly free on the state clock, and it is what lets you tell moving from
      parked in the data. Omitting it makes over-consumption undiagnosable.
  - id: supply_voltage
    family: vehicle_state
    clock: state
    bytes: 2
    encoding: raw
    default: false
  - id: odometer
    family: vehicle_state
    clock: state
    bytes: 4
    encoding: raw
    default: false
  - id: digital_io
    family: vehicle_state
    clock: state
    bytes: 2
    encoding: raw
    default: false
  - id: analog_inputs
    family: vehicle_state
    clock: state
    bytes: 4
    encoding: raw
    default: false
  - id: engine_data
    family: vehicle_state
    clock: state
    bytes: 8
    encoding: raw
    default: false
    note: "aggregate placeholder for on-board diagnostic values"

# ---------------------------------------------------------------------------
# Behavioural profiles
#
# Presets only. Every value can be overridden. The names are the architecture,
# not a judgement: the axis that matters is periodic versus event-driven.
# ---------------------------------------------------------------------------

profiles:

  naive:
    label_en: "naive periodic"
    label_fr: "periodique naif"
    description: >
      Fixed output rate, one record per transmission, no batching, no
      compression, repeats the last fix at the output rate, transmits while
      parked, reconnects for every transmission.
    device:
      sample_rate_hz: 10
      fix_rate_hz: 1
      output_rate_hz: 10
      send_period_s: 10
      records_per_send: null      # derived from output_rate_hz * send_period_s
      dedup_repeated_fix: false
      repeat_state_each_record: true
      compression_ratio: 1.0
      session_policy: reconnect_per_send
      tls: false
      emit_when_parked: true
      heartbeat_period_s: 300
      state_events_per_hour: 60
    fields:
      device_id: true

  periodic:
    label_en: "periodic, batched"
    label_fr: "periodique groupe"
    description: >
      Fixed output rate, moderate batching, persistent session, no
      compression, stops emitting the inertial stream when parked but keeps a
      heartbeat.
    device:
      sample_rate_hz: 10
      fix_rate_hz: 1
      output_rate_hz: 1
      send_period_s: 30
      records_per_send: null
      dedup_repeated_fix: true
      repeat_state_each_record: false
      compression_ratio: 1.0
      session_policy: persistent
      tls: true
      emit_when_parked: false
      heartbeat_period_s: 300
      state_events_per_hour: 60

  event_driven:
    label_en: "event-driven"
    label_fr: "evenementiel"
    description: >
      Emits when the information changes rather than on a clock: aggressive
      batching, delta compression, deduplicated fixes, silent when parked
      apart from a slow heartbeat, long-lived session.
    device:
      sample_rate_hz: 10
      fix_rate_hz: 1
      output_rate_hz: 1
      send_period_s: 120
      records_per_send: null
      dedup_repeated_fix: true
      repeat_state_each_record: false
      compression_ratio: 4.0
      session_policy: persistent
      tls: true
      emit_when_parked: false
      heartbeat_period_s: 900
      state_events_per_hour: 60
    fields:
      accel_xyz: false
